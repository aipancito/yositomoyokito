<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>INICIO DE SESION</title>
    
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }

      body {
        display: flex;
        width: 100vw;
        height: 100dvh; /* Solución para celulares (evita que se corte con la barra del navegador) */
        justify-content: center;
        align-items: center;
        background-color: #faf2c5;
        overflow: hidden;
      }

      .container {
        width: 90%;
        max-width: 320px;
        text-align: center;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        border-radius: 20px;
        border: 2px solid #ffeb3b;
      }

      .container h2 {
        font-size: 1.4rem;
        color: #333;
        line-height: 1.3;
      }

      .subtitle-surprise {
        font-size: 12px;
        color: #b89767;
        font-weight: 500;
        margin-top: 4px;
        margin-bottom: 10px;
      }

      .input-display {
        text-align: center;
        margin: 8px 0 12px 0;
        font-size: 26px;
        letter-spacing: 4px;
        background-color: #fffdf4;
        padding: 8px;
        border-radius: 12px;
        border: 2px dashed #e6cc8a;
        color: #8c7355;
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .keypad button {
        padding: 12px;
        font-size: 20px;
        font-weight: 600;
        background-color: #dfc298;
        color: #3b2308;
        border: none;
        border-radius: 12px;
        outline: none;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.08);
      }

      .keypad button:hover {
        background-color: #fae483;
        transform: translateY(-2px);
      }

      .keypad button:active {
        transform: translateY(1px);
      }

      .keypad button:last-child {
        grid-column: 2/3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>
        🔓<br />
        Ingrese la contraseña
      </h2>
      <div class="subtitle-surprise">✨ Descubre la sorpresa secreta ✨</div>
      <div class="input-display" id="inputDisplay">••••••</div>
      <div class="keypad">
        <button class="key" onclick="enterDigit('1')">1</button>
        <button class="key" onclick="enterDigit('2')">2</button>
        <button class="key" onclick="enterDigit('3')">3</button>
        <button class="key" onclick="enterDigit('4')">4</button>
        <button class="key" onclick="enterDigit('5')">5</button>
        <button class="key" onclick="enterDigit('6')">6</button>
        <button class="key" onclick="enterDigit('7')">7</button>
        <button class="key" onclick="enterDigit('8')">8</button>
        <button class="key" onclick="enterDigit('9')">9</button>
        <button class="key" onclick="enterDigit('0')">0</button>
      </div>
    </div>

    <script>
      const correctPassword = "300826";
      const display = document.getElementById("inputDisplay");
      let input = "";
      
      function enterDigit(digit) {
        if (input.length < 6) {
          input += digit;
        }
        display.textContent = input.padEnd(6, "•");
        if (input.length === 6) {
          if (input === correctPassword) {
            window.location.href = "flower.html"; 
          } else {
            alert("Contraseña incorrecta, pero te dare una pista: el dia que te conoci");
            input = "";
            display.textContent = "••••••";
          }
        }
      }
    </script>
  </body>
</html>
